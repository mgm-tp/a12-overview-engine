server.port=12090

# Profiles
spring.profiles.active=dataservices-actuators,dataservices-rpc,\
  dataservices-embedded_postgres,contentstore-embedded_postgres,\
  dataservices-embedded_contentstore,dataservices-uaa,dataservices-cdd_async,\
  content-store,attachments,uaa

# Database
spring.datasources.dataservices.embedded-postgres.path=file:${DB_TEMP_DIR}/db/ds-embedded-postgres
spring.datasources.contentstore.embedded-postgres.path=file:${DB_TEMP_DIR}/db/cs-embedded-postgres

# Data/Models (import)
mgmtp.a12.dataservices.initialization.import.models.path=classpath:/models
mgmtp.a12.dataservices.search.index.initialization.mode=rebuild_index
mgmtp.a12.dataservices.cdd.model.modificationAfterInitialization.enabled=true
mgmtp.a12.dataservices.rest.context-path=/api

# Query
mgmtp.a12.dataservices.query.reindexing.mode=REBUILD_INDEX
mgmtp.a12.dataservices.query.page-request.page-size-limit=9999
mgmtp.a12.dataservices.json-rpc.max-method-calls-per-request=999

# Debugging
management.endpoint.health.showDetails=always

mgmtp.a12.dataservices.seed-data.delete.enabled=true
mgmtp.a12.dataservices.seed-data.export.enabled=true
mgmtp.a12.dataservices.seed-data.import.enabled=true

# Unique Hazelcast cluster name -- isolates this server's L2 cache from
# other A12 dev servers (CE/TE/RE/...) running on the same workstation.
# Without it they auto-merge clusters and share model state, breaking
# init with "Changing of model type is not permitted for [X]".
hz.clusterName=overviewengine-dev

