import groovy.json.JsonSlurper

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.yaml:snakeyaml:2.2"
    }
}

dependencyResolutionManagement {
    def springBootVersion = '3.4.1'
    def a12Version = getA12Versions()
    versionCatalogs {
        gradlePluginLibs {
            version('spring-boot', springBootVersion)
            version('node-gradle', '7.1.0')
            version('docker-remote-api', '10.0.0')
            version('devtools-deployment', '0.7.2')
            version('git-version', '4.3.0')
            version('artifact-publish', '0.4.3')

            plugin('git-version', "com.palantir.git-version").versionRef('git-version')
            plugin('artifact-publish', "com.mgmtp.a12.bd.artifact-publish").versionRef('artifact-publish')
            plugin('devtools-deployment', "com.mgmtp.a12.devtools.plugins.deployment").versionRef('devtools-deployment')
            plugin('docker-remote-api', "com.bmuschko.docker-remote-api").versionRef('docker-remote-api')
            plugin('spring-boot', 'org.springframework.boot').versionRef('spring-boot')
            plugin('node-gradle', 'com.github.node-gradle.node').versionRef('node-gradle')
        }

        a12Libs {
            version('base', a12Version.base)
            version('build-utilities', '0.1.0')
            version('kernel', a12Version.kernel)
            version('dataservices', a12Version.dataservices)
            version('wcf', '0.2.0')
            version('rmc-conversion', '0.4.0-pre.4.1')

            library('build-utilities', 'com.mgmtp.a12.devtools.plugins', 'build-utilities').versionRef('build-utilities')
            library('dataservices-server-app', 'com.mgmtp.a12.dataservices', 'dataservices-server-app').versionRef('dataservices')

            library('base-bom', 'com.mgmtp.a12.base', 'base-bom').versionRef('base')
            library('base-model-api', 'com.mgmtp.a12.base', 'base-model-api').versionRef('base')

            library('kernel-bom', 'com.mgmtp.a12.kernel', 'kernel-bom').versionRef('kernel')

            library('dataservices-bom', 'com.mgmtp.a12.dataservices', 'dataservices-parent').versionRef('dataservices')
            library('dataservices-server-init-app', 'com.mgmtp.a12.dataservices', 'dataservices-server-init-app').versionRef('dataservices')
            library('dataservices-wcf-cli', 'com.mgmtp.a12.dataservices.wcf', 'dataservices-wcf-cli').versionRef('wcf')
            library('dataservices-wcf-api', 'com.mgmtp.a12.dataservices.wcf', 'dataservices-wcf-api').versionRef('wcf')
            library('rmc-conversion', 'com.mgmtp.a12.rmc', 'conversion').versionRef('rmc-conversion')
        }

        libs {
            version('spring-boot', springBootVersion)
            version('logstash', '7.4')
            version('logback-classic', '1.5.6')
            version('jackson', '3.1.2')

            library('spring-boot-configuration-processor', 'org.springframework.boot', 'spring-boot-configuration-processor').versionRef('spring-boot')
            library('spring-boot-devtools', 'org.springframework.boot', 'spring-boot-devtools').versionRef('spring-boot')
            library('logstash', 'net.logstash.logback', 'logstash-logback-encoder').versionRef('logstash')
            library('logback-classic', 'ch.qos.logback', 'logback-classic').versionRef('logback-classic')
            library('jackson-databind', 'tools.jackson.core', 'jackson-databind').versionRef('jackson')
        }
    }
}

HashMap<String, String> getA12Versions() {
    def yaml = new org.yaml.snakeyaml.Yaml(new org.yaml.snakeyaml.LoaderOptions())

    def getVersion = { String packageName ->
        def overrideVersion = new JsonSlurper().parse(file("package.json"))["pnpm"]?["overrides"]?[packageName]?.replaceAll(/^[~^]/, '')
        def catalogVersion = yaml.load(file("pnpm-workspace.yaml").newInputStream())["catalogs"]["a12Libs"][packageName].replaceAll(/^[~^]/, '') as String

        return overrideVersion ?: catalogVersion
    }

    return [
            base        : getVersion('@com.mgmtp.a12.base/base-model-api'),
            kernel      : getVersion('@com.mgmtp.a12.kernel/kernel-md-facade'),
            dataservices: getVersion('@com.mgmtp.a12.dataservices/dataservices-access')
    ]
}

gradle.ext.a12Versions = getA12Versions()

include "server"
include "showcase-models-converters"
